name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build-extension:
    name: Build Chrome & Firefox Extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build Harper WASM and JS packages
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          (cd vendor/harper/harper-wasm && wasm-pack build --target web --out-name harper_wasm && wasm-pack build --target web --out-name harper_wasm_slim --no-default-features)
          (cd vendor/harper && pnpm install --engine-strict=false && pnpm --filter harper.js build && pnpm --filter lint-framework build)

      - name: Install dependencies and package extensions
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter lexel-ui build
          pnpm --filter lexel-browser zip:chrome
          pnpm --filter lexel-browser zip:firefox
          mkdir -p release-artifacts
          cp packages/lexel-browser/lexel-chrome.zip release-artifacts/
          cp packages/lexel-browser/lexel-firefox.zip release-artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: browser-extensions
          path: release-artifacts/*.zip

  build-desktop-and-cli:
    name: Build Desktop, Daemon & CLI (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: macos-latest
            target: macos-arm64
          - os: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux Tauri system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release CLI, Daemon, and LSP binaries
        run: cargo build --release -p lexel-cli -p lexel-daemon -p lexel-ls

      - name: Build Tauri Desktop bundles
        run: pnpm run tauri:build

      - name: Collect platform artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          if [ "${RUNNER_OS}" = "Windows" ]; then
            cp target/release/lexel.exe "release-artifacts/lexel-cli-${{ matrix.target }}.exe"
            cp target/release/lexel-daemon.exe "release-artifacts/lexel-daemon-${{ matrix.target }}.exe"
            cp target/release/lexel-ls.exe "release-artifacts/lexel-ls-${{ matrix.target }}.exe"
            find apps/lexel-desktop/src-tauri/target/release/bundle -type f \( -name "*.msi" -o -name "*.exe" \) -exec cp {} release-artifacts/ \;
          elif [ "${RUNNER_OS}" = "macOS" ]; then
            cp target/release/lexel "release-artifacts/lexel-cli-${{ matrix.target }}"
            cp target/release/lexel-daemon "release-artifacts/lexel-daemon-${{ matrix.target }}"
            cp target/release/lexel-ls "release-artifacts/lexel-ls-${{ matrix.target }}"
            find apps/lexel-desktop/src-tauri/target/release/bundle -type f -name "*.dmg" -exec cp {} release-artifacts/ \;
          else
            cp target/release/lexel "release-artifacts/lexel-cli-${{ matrix.target }}"
            cp target/release/lexel-daemon "release-artifacts/lexel-daemon-${{ matrix.target }}"
            cp target/release/lexel-ls "release-artifacts/lexel-ls-${{ matrix.target }}"
            find apps/lexel-desktop/src-tauri/target/release/bundle -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" \) -exec cp {} release-artifacts/ \;
          fi
          ls -lh release-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: platform-${{ matrix.target }}
          path: release-artifacts/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-extension, build-desktop-and-cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: all-artifacts
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: all-artifacts/*
