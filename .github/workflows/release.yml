name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build-extensions-and-plugins:
    name: Build Browser, VS Code & Obsidian Extensions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build Harper WASM and JS packages
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          (cd vendor/harper/harper-wasm && wasm-pack build --target web --out-name harper_wasm && wasm-pack build --target web --out-name harper_wasm_slim --no-default-features)
          (cd vendor/harper && pnpm install --engine-strict=false && pnpm --filter harper.js build && pnpm --filter lint-framework build)

      - name: Install dependencies and package extensions
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter lexel-ui build
          pnpm --filter lexel-browser zip:chrome
          pnpm --filter lexel-browser zip:firefox
          pnpm --filter lexel-vscode build
          pnpm --filter lexel-obsidian build
          mkdir -p release-artifacts
          cp packages/lexel-browser/lexel-chrome.zip release-artifacts/
          cp packages/lexel-browser/lexel-firefox.zip release-artifacts/
          (
            cd packages/lexel-obsidian
            cp manifest.json dist/manifest.json
            cd dist
            zip -qr "${GITHUB_WORKSPACE}/release-artifacts/lexel-obsidian-plugin.zip" manifest.json main.js
          )
          (
            cd packages/lexel-vscode
            zip -qr "${GITHUB_WORKSPACE}/release-artifacts/lexel-vscode.zip" package.json icon.png dist
          )
          ls -lh release-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: extensions-and-plugins
          path: release-artifacts/*.zip

  build-desktop-and-cli:
    name: Build Desktop, Daemon & CLI (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: macos-latest
            target: macos-arm64
          - os: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux Tauri system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libssl-dev \
            libxdo-dev \
            patchelf \
            rpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release CLI, Daemon, and LSP binaries
        run: cargo build --release -p lexel-cli -p lexel-daemon -p lexel-ls

      - name: Build Tauri Desktop bundles
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        run: pnpm run tauri:build

      - name: Collect platform artifacts
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          if [ "${RUNNER_OS}" = "Windows" ]; then
            cp target/release/lexel.exe "release-artifacts/lexel-cli-${{ matrix.target }}.exe"
            cp target/release/lexel-daemon.exe "release-artifacts/lexel-daemon-${{ matrix.target }}.exe"
            cp target/release/lexel-ls.exe "release-artifacts/lexel-ls-${{ matrix.target }}.exe"
            (
              cd target/release
              7z a -tzip "${GITHUB_WORKSPACE}/release-artifacts/lexel-${RELEASE_TAG}-${{ matrix.target }}.zip" lexel.exe lexel-daemon.exe lexel-ls.exe >/dev/null
            )
            find apps/lexel-desktop/src-tauri/target/release/bundle -type f \( -name "*.msi" -o -name "*.exe" \) -exec cp {} release-artifacts/ \;
            first_exe="$(find apps/lexel-desktop/src-tauri/target/release/bundle -type f -name "*-setup.exe" | head -n 1 || true)"
            if [ -n "${first_exe}" ]; then
              cp "${first_exe}" "release-artifacts/lexel-desktop-${{ matrix.target }}-setup.exe"
            fi
            first_msi="$(find apps/lexel-desktop/src-tauri/target/release/bundle -type f -name "*.msi" | head -n 1 || true)"
            if [ -n "${first_msi}" ]; then
              cp "${first_msi}" "release-artifacts/lexel-desktop-${{ matrix.target }}.msi"
            fi
          elif [ "${RUNNER_OS}" = "macOS" ]; then
            cp target/release/lexel "release-artifacts/lexel-cli-${{ matrix.target }}"
            cp target/release/lexel-daemon "release-artifacts/lexel-daemon-${{ matrix.target }}"
            cp target/release/lexel-ls "release-artifacts/lexel-ls-${{ matrix.target }}"
            tar -C target/release -czf "release-artifacts/lexel-${RELEASE_TAG}-${{ matrix.target }}.tar.gz" lexel lexel-daemon lexel-ls
            find apps/lexel-desktop/src-tauri/target/release/bundle -type f -name "*.dmg" -exec cp {} release-artifacts/ \;
            first_dmg="$(find apps/lexel-desktop/src-tauri/target/release/bundle -type f -name "*.dmg" | head -n 1 || true)"
            if [ -n "${first_dmg}" ]; then
              cp "${first_dmg}" "release-artifacts/lexel-desktop-${{ matrix.target }}.dmg"
            fi
          else
            cp target/release/lexel "release-artifacts/lexel-cli-${{ matrix.target }}"
            cp target/release/lexel-daemon "release-artifacts/lexel-daemon-${{ matrix.target }}"
            cp target/release/lexel-ls "release-artifacts/lexel-ls-${{ matrix.target }}"
            tar -C target/release -czf "release-artifacts/lexel-${RELEASE_TAG}-${{ matrix.target }}.tar.gz" lexel lexel-daemon lexel-ls
            cp apps/lexel-desktop/src-tauri/target/release/lexel-desktop "release-artifacts/lexel-desktop-${{ matrix.target }}"
            find apps/lexel-desktop/src-tauri/target/release/bundle -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.rpm" \) -exec cp {} release-artifacts/ \;
            first_appimage="$(find apps/lexel-desktop/src-tauri/target/release/bundle -type f -name "*.AppImage" | head -n 1 || true)"
            if [ -n "${first_appimage}" ]; then
              cp "${first_appimage}" "release-artifacts/lexel-desktop-${{ matrix.target }}.AppImage"
            fi
            first_deb="$(find apps/lexel-desktop/src-tauri/target/release/bundle -type f -name "*.deb" | head -n 1 || true)"
            if [ -n "${first_deb}" ]; then
              cp "${first_deb}" "release-artifacts/lexel-desktop-${{ matrix.target }}.deb"
            fi
          fi
          ls -lh release-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: platform-${{ matrix.target }}
          path: release-artifacts/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-extensions-and-plugins, build-desktop-and-cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: all-artifacts
        run: sha256sum * > SHA256SUMS.txt

      - name: Render Homebrew, AUR, and Winget manifests from real SHA-256 outputs
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          bash scripts/render-packaging.sh \
            --tag "${RELEASE_TAG}" \
            --checksums all-artifacts/SHA256SUMS.txt \
            --out rendered-packaging \
            --repo "${GITHUB_REPOSITORY}"
          cp rendered-packaging/homebrew/lexel.rb all-artifacts/lexel.rb
          cp rendered-packaging/aur/PKGBUILD all-artifacts/PKGBUILD
          cp rendered-packaging/winget/LexelAI.Lexel.yaml all-artifacts/LexelAI.Lexel.yaml
          cp rendered-packaging/winget/LexelAI.Lexel.installer.yaml all-artifacts/LexelAI.Lexel.installer.yaml
          cp rendered-packaging/winget/LexelAI.Lexel.locale.en-US.yaml all-artifacts/LexelAI.Lexel.locale.en-US.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: package-manifests
          path: rendered-packaging/**

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Lexel ${{ inputs.tag || github.ref_name }}
          make_latest: true
          generate_release_notes: true
          files: all-artifacts/*
