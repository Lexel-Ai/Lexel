name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust Core, Daemon, CLI & Weirpack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Workspace tests
        run: cargo test --workspace

      - name: Validate anti-slop Weirpack
        run: cargo run -p lexel-cli -- weirpack validate rules/lexel-antislop.weirpack

  desktop-rust:
    name: Lexel Desktop (Tauri Rust Check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/lexel-desktop/src-tauri

      - name: Format check (Tauri)
        run: cargo fmt --manifest-path apps/lexel-desktop/src-tauri/Cargo.toml --check

      - name: Clippy (Tauri)
        run: cargo clippy --manifest-path apps/lexel-desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

  web-and-extension:
    name: UI Kit, Desktop Frontend & Browser Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Compute upstream Harper SHA
        id: harper_sha
        run: echo "sha=$(git -C vendor/harper rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache built Harper WASM and JS packages
        id: harper_cache
        uses: actions/cache@v4
        with:
          path: |
            vendor/harper/harper-wasm/pkg
            vendor/harper/packages/harper.js/dist
            vendor/harper/packages/lint-framework/dist
          key: harper-dist-${{ runner.os }}-${{ steps.harper_sha.outputs.sha }}

      - name: Build Harper WASM and headless JS packages
        if: steps.harper_cache.outputs.cache-hit != 'true'
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          (cd vendor/harper/harper-wasm && wasm-pack build --target web --out-name harper_wasm && wasm-pack build --target web --out-name harper_wasm_slim --no-default-features)
          (cd vendor/harper && pnpm install --engine-strict=false && pnpm --filter harper.js build && pnpm --filter lint-framework build)

      - name: Install Lexel workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome lint & format check
        run: pnpm run check

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit tests
        run: pnpm -r test

      - name: Build UI, Desktop frontend, and Browser Extension
        run: pnpm -r build

      - name: Package Chrome and Firefox extension zips
        run: |
          pnpm --filter lexel-browser zip:chrome
          pnpm --filter lexel-browser zip:firefox
