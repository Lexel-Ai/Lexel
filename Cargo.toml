[workspace]
members = [
  "crates/lexel-core",
  "crates/lexel-db",
  "crates/lexel-daemon",
  "crates/lexel-cli",
]
exclude = ["vendor/harper", "apps/lexel-desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
aho-corasick = "1.1"
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
dirs = "7.0"
regex = "1.12"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "process", "time", "signal", "io-std", "io-util", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1.16", features = ["v4"] }
